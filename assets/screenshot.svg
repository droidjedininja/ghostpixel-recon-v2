<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <rect width="100%" height="100%" fill="#0a0a0a"/>
  <text x="48" y="64" fill="#00ffe1" font-family="Consolas,monospace" font-size="28">GhostPixel — Bronx Edition</text>

  <g transform="translate(48,96)">
    <rect width="520" height="280" rx="8" fill="#141414" stroke="#222"/>

    <text x="18" y="36" fill="#ffffff" font-family="Consolas,monospace" font-size="14">Results</text>
    <text x="18" y="64" fill="#ffffff" font-family="Consolas,monospace" font-size="12">Host: example.com</text>
    <text x="18" y="86" fill="#ffffff" font-family="Consolas,monospace" font-size="12">Size: 1024 × 768</text>
    <text x="18" y="108" fill="#ffffff" font-family="Consolas,monospace" font-size="12">Time: 123ms</text>

    <rect x="18" y="140" width="220" height="120" fill="#000" stroke="#333" rx="4"/>
    <text x="28" y="158" fill="#00ffe1" font-family="Consolas,monospace" font-size="11">Preview</text>
    <rect x="256" y="140" width="240" height="120" fill="#0b0b0b" stroke="#333" rx="4"/>
    <text x="264" y="158" fill="#fff" font-family="Consolas,monospace" font-size="11">History (most recent)</text>

    <g transform="translate(18,270)">
      <rect width="520" height="30" rx="4" fill="#0d0d0d" stroke="#222"/>
      <text x="12" y="20" fill="#888" font-family="Consolas,monospace" font-size="12">Enter image URL here</text>
    </g>
  </g>

  <g transform="translate(600,96)">
    <rect width="300" height="280" rx="8" fill="#141414" stroke="#222"/>
    <text x="18" y="36" fill="#ffffff" font-family="Consolas,monospace" font-size="14">Controls</text>

    <rect x="18" y="56" width="120" height="36" rx="6" fill="#111" stroke="#00ffe1"/>
    <text x="36" y="80" fill="#fff" font-family="Consolas,monospace" font-size="12">Run Scan</text>

    <rect x="156" y="56" width="120" height="36" rx="6" fill="#111" stroke="#00ffe1"/>
    <text x="174" y="80" fill="#fff" font-family="Consolas,monospace" font-size="12">Clear History</text>

    <rect x="18" y="108" width="120" height="36" rx="6" fill="#111" stroke="#00ffe1"/>
    <text x="36" y="132" fill="#fff" font-family="Consolas,monospace" font-size="12">Export JSON</text>

    <text x="18" y="176" fill="#ccc" font-family="Consolas,monospace" font-size="11">Workshop targets:</text>
    <rect x="18" y="190" width="258" height="34" rx="6" fill="#0b0b0b" stroke="#222"/>
    <text x="36" y="213" fill="#fff" font-family="Consolas,monospace" font-size="12">Python logo / Large image</text>
  </g>

  <text x="48" y="420" fill="#666" font-family="Consolas,monospace" font-size="11">Client-side recon tool • localStorage history • single HTML file</text>
</svg>
