<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GhostPixel Bronx Edition</title>

<style>
body{
    background:#0a0a0a;
    color:#ffffff;
    font-family:Consolas,monospace;
    padding:20px;
}

h1{
    color:#00ffe1;
}

.panel{
    background:#141414;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    background:#000;
    color:white;
    border:1px solid #333;
}

button{
    padding:10px;
    margin-top:10px;
    margin-right:5px;
    background:#111;
    color:white;
    border:1px solid #00ffe1;
    cursor:pointer;
}

.result{
    background:#000;
    margin-top:10px;
    padding:10px;
    border-left:4px solid #00ffe1;
}
</style>
</head>

<body>

<h1>GhostPixel Bronx Edition</h1>

<div class="panel">

<input
id="targetUrl"
placeholder="https://example.com/image.png">

<br>

<button onclick="runScan()">
Run Scan
</button>

<button onclick="clearHistory()">
Clear History
</button>

</div>

<div class="panel">

<h3>Workshop Targets</h3>

<button onclick="setTarget('https://www.python.org/static/community\_logos/python-logo.png')">
Python
</button>

<button onclick="setTarget('https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock\_big.jpg')">
Large Image
</button>

</div>

<div class="panel">

<h3>Results</h3>

<div id="results"></div>

</div>

<div class="panel">

<h3>History</h3>

<div id="history"></div>

</div>

<script>

function setTarget(url){
    document.getElementById("targetUrl").value=url;
}

function saveHistory(item){

    let history=
    JSON.parse(
        localStorage.getItem(
            "ghostpixel-history"
        ) || "[]"
    );

    history.unshift(item);

    localStorage.setItem(
        "ghostpixel-history",
        JSON.stringify(history)
    );

    loadHistory();
}

function loadHistory(){

    let history=
    JSON.parse(
        localStorage.getItem(
            "ghostpixel-history"
        ) || "[]"
    );

    const div=
    document.getElementById(
        "history"
    );

    div.innerHTML="";

    history.forEach(item=>{

        const row=
        document.createElement("div");

        row.className="result";

        row.textContent=
        item.host+
        " | "+
        item.status;

        div.appendChild(row);

    });
}

function clearHistory(){

    localStorage.removeItem(
        "ghostpixel-history"
    );

    loadHistory();
}

function runScan(){

    const url=
    document.getElementById(
        "targetUrl"
    ).value.trim();

    if(!url){

        alert(
            "Enter an image URL"
        );

        return;

    }

    let parsed;

    try{

        parsed=
        new URL(url);

    }catch{

        alert(
            "Invalid URL"
        );

        return;

    }

    const img=
    new Image();

    const start=
    performance.now();

    img.onload=()=>{

        const ms=
        Math.round(
            performance.now()-start
        );

        const result=
        `
        ✅ Loaded<br>
        Host: ${parsed.hostname}<br>
        Size:
        ${img.naturalWidth}
        ×
        ${img.naturalHeight}<br>
        Time:
        ${ms}ms
        `;

        document.getElementById(
            "results"
        ).innerHTML=
        `<div class="result">
        ${result}
        </div>`;

        saveHistory({
            host:parsed.hostname,
            status:"Loaded"
        });

    };

    img.onerror=()=>{

        document.getElementById(
            "results"
        ).innerHTML=
        `<div class="result">
        ❌ Failed
        </div>`;

        saveHistory({
            host:parsed.hostname,
            status:"Failed"
        });

    };

    img.src=url;

}

loadHistory();

</script>

</body>
</html>
