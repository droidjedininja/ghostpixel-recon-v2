<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GhostPixel Recon v3</title>

<style>
:root{
--bg:#090909;
--card:#151515;
--accent:#00ffe1;
--pink:#ff4dff;
--text:#f0f0f0;
--muted:#9a9a9a;
--danger:#ff4d4d;
--success:#00ff80;
--warning:#ffd24d;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Consolas,monospace;
padding:20px;
}

h1{
color:var(--accent);
text-shadow:0 0 15px var(--accent);
margin-top:0;
}

.panel{
background:var(--card);
padding:15px;
margin-bottom:15px;
border:1px solid #222;
border-radius:10px;
}

input{
width:100%;
padding:12px;
background:#111;
border:1px solid #333;
color:white;
margin-top:10px;
margin-bottom:12px;
}

button{
cursor:pointer;
padding:10px 15px;
margin:5px;
background:#111;
color:white;
border:1px solid var(--accent);
}

button:hover{
background:#1d1d1d;
}

.result{
padding:10px;
margin-top:10px;
border-left:4px solid var(--accent);
background:#101010;
white-space:pre-wrap;
}

.history-entry{
padding:8px;
margin-top:6px;
background:#111;
border-left:3px solid var(--pink);
font-size:12px;
}

.badge{
display:inline-block;
padding:3px 8px;
margin-left:6px;
border-radius:4px;
font-size:12px;
}

.info{
background:#2a2a2a;
}

.low{
background:#0066cc;
}

.medium{
background:#cc8800;
}

.high{
background:#cc0000;
}

.timeline{
color:var(--muted);
font-size:13px;
margin-top:10px;
white-space:pre-wrap;
}

.score{
font-size:32px;
font-weight:bold;
color:var(--accent);
}

.small{
color:var(--muted);
font-size:13px;
}

pre{
overflow:auto;
}
</style>
</head>
<body>

<h1>🕵 GhostPixel Recon v3</h1>

<div class="panel">
<p>Browser-native image reconnaissance toolkit.</p>

<input
id="targetUrl"
placeholder="https://example.com/image.png">

<button onclick="runRecon()">Run Recon</button>
<button onclick="exportJSON()">Export JSON</button>
<button onclick="clearHistory()">Clear History</button>
</div>

<div class="panel">
<h3>Risk Score</h3>
<div id="score" class="score">--</div>
</div>

<div class="panel">
<h3>Results</h3>
<div id="results"></div>
</div>

<div class="panel">
<h3>Timeline</h3>
<div id="timeline" class="timeline"></div>
</div>

<div class="panel">
<h3>Scan History</h3>
<div id="history"></div>
</div>

<script>

let latestScan = null;

loadHistory();

function addTimeline(msg){
const time = new Date().toLocaleTimeString();
document.getElementById("timeline").textContent +=
`[${time}] ${msg}\n`;
}

function escapeHTML(str){
const div=document.createElement("div");
div.textContent=str;
return div.innerHTML;
}

function riskLabel(score){

if(score < 25){
return "INFO";
}

if(score < 50){
return "LOW";
}

if(score < 75){
return "MEDIUM";
}

return "HIGH";
}

function renderScore(score){

let cls="info";

if(score>=25) cls="low";
if(score>=50) cls="medium";
if(score>=75) cls="high";

document.getElementById("score").innerHTML=
`${score}
<span class="badge ${cls}">
${riskLabel(score)}
</span>`;
}

function saveHistory(entry){

const history=
JSON.parse(
localStorage.getItem("ghostpixel-history")
|| "[]"
);

history.unshift(entry);

if(history.length>25){
history.length=25;
}

localStorage.setItem(
"ghostpixel-history",
JSON.stringify(history)
);

loadHistory();
}

function loadHistory(){

const history=
JSON.parse(
localStorage.getItem("ghostpixel-history")
|| "[]"
);

const container=document.getElementById("history");

container.innerHTML="";

history.forEach(item=>{

const div=document.createElement("div");
div.className="history-entry";

div.textContent=
`${item.date}
 | ${item.host}
 | ${item.risk}
 | ${item.status}`;

container.appendChild(div);
});
}

function clearHistory(){

if(confirm("Delete all scan history?")){

localStorage.removeItem(
"ghostpixel-history"
);

loadHistory();
}
}

function exportJSON(){

if(!latestScan){
alert("Run a scan first.");
return;
}

const blob=new Blob(
[
JSON.stringify(
latestScan,
null,
2
)
],
{type:"application/json"}
);

const link=document.createElement("a");

link.href=URL.createObjectURL(blob);
link.download="ghostpixel-report.json";
link.click();
}

function runRecon(){

const urlInput=
document.getElementById("targetUrl");

const url=urlInput.value.trim();

if(!url){
alert("Enter a URL.");
return;
}

document.getElementById("results").innerHTML="";
document.getElementById("timeline").textContent="";
document.getElementById("score").textContent="...";

addTimeline("Scan started");

let parsed;

try{
parsed=new URL(url);
}
catch{
alert("Invalid URL.");
return;
}

const host=parsed.hostname;

let risk=0;

const findings=[];

if(parsed.search.length>50){
risk+=15;
findings.push(
"Long query string detected."
);
}

if(parsed.search.includes("token")){
risk+=20;
findings.push(
"Parameter contains token."
);
}

if(parsed.search.includes("id")){
risk+=10;
findings.push(
"Identifier parameter present."
);
}

const img=new Image();

const start=performance.now();

img.onload=()=>{

addTimeline("Image loaded");

const end=performance.now();

const loadTime=
Math.round(end-start);

const width=img.naturalWidth;
const height=img.naturalHeight;

if(width<=2 && height<=2){

risk+=60;

findings.push(
"Potential tracking pixel (1x1 or 2x2 image)."
);
}

if(loadTime>3000){

risk+=15;

findings.push(
"Slow image response."
);
}

const report={
status:"Loaded",
url:url,
host:host,
protocol:parsed.protocol,
pathname:parsed.pathname,
search:parsed.search,
width:width,
height:height,
loadTime:loadTime,
risk:risk,
riskLabel:riskLabel(risk),
findings:findings,
date:new Date().toLocaleString()
};

latestScan=report;

renderScore(risk);

const container=
document.getElementById("results");

container.innerHTML=
`
<div class="result">
✅ Image Loaded

Host: ${escapeHTML(host)}
Protocol: ${escapeHTML(parsed.protocol)}
Path: ${escapeHTML(parsed.pathname)}

Dimensions:
${width} × ${height}

Load Time:
${loadTime} ms

Risk:
${riskLabel(risk)}

Findings:
${findings.length ?
findings.join("\n")
:
"No notable findings"}
</div>
`;

saveHistory({
date:report.date,
host:report.host,
risk:report.riskLabel,
status:report.status
});

addTimeline(
"Analysis complete"
);
};

img.onerror=()=>{

risk+=20;

const report={
status:"Failed",
url:url,
host:host,
risk:risk,
riskLabel:riskLabel(risk),
date:new Date().toLocaleString()
};

latestScan=report;

renderScore(risk);

document.getElementById(
"results"
).innerHTML=
`
<div class="result">
❌ Image Failed To Load

Host:
${escapeHTML(host)}

Risk:
${riskLabel(risk)}

This may indicate:
- Missing asset
- Access restrictions
- Unsupported image
- Network issue
</div>
`;

saveHistory({
date:report.date,
host:host,
risk:report.riskLabel,
status:"Failed"
});

addTimeline(
"Image failed to load"
);
};

img.src=url;
}
</script>

</body>
</html>
