<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GhostPixel Bronx Edition</title>

<style>
body{
    background:#0a0a0a;
    color:#ffffff;
    font-family:Consolas,monospace;
    padding:20px;
}

h1{
    color:#00ffe1;
}

.panel{
    background:#141414;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    background:#000;
    color:white;
    border:1px solid #333;
}

button{
    padding:10px;
    margin-top:10px;
    margin-right:5px;
    background:#111;
    color:white;
    border:1px solid #00ffe1;
    cursor:pointer;
}

.result{
    background:#000;
    margin-top:10px;
    padding:10px;
    border-left:4px solid #00ffe1;
}

.preview{
    max-width:100%;
    margin-top:10px;
    border:1px solid #333;
}
</style>
</head>

<body>

<h1>GhostPixel Bronx Edition</h1>

<div class="panel">

<input
id="targetUrl"
placeholder="https://example.com/image.png">

<br>

<button onclick="runScan()">
Run Scan
</button>

<button onclick="clearHistory()">
Clear History
</button>

<button onclick="exportHistory()">
Export JSON
</button>

</div>

<div class="panel">

<h3>Workshop Targets</h3>

<button onclick="setTarget('https://www.python.org/static/community_logos/python-logo.png')">
Python
</button>

<button onclick="setTarget('https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg')">
Large Image
</button>

</div>

<div class="panel">

<h3>Results</h3>

<div id="results"></div>
<img id="preview" class="preview" alt="Image preview" style="display:none">

</div>

<div class="panel">

<h3>History</h3>

<div id="history"></div>

</div>

<script>

const MAX_HISTORY = 50;

function setTarget(url){
    document.getElementById("targetUrl").value=url;
}

function saveHistory(item){

    let history = JSON.parse(localStorage.getItem("ghostpixel-history") || "[]");

    history.unshift(item);

    if(history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);

    localStorage.setItem("ghostpixel-history", JSON.stringify(history));

    loadHistory();
}

function loadHistory(){

    let history = JSON.parse(localStorage.getItem("ghostpixel-history") || "[]");

    const div = document.getElementById("history");

    div.innerHTML = "";

    history.forEach(item=>{

        const row = document.createElement("div");

        row.className = "result";

        // simple text content to avoid injecting HTML
        row.textContent = `${item.time} | ${item.host} | ${item.status}`;

        div.appendChild(row);

    });
}

function clearHistory(){

    localStorage.removeItem("ghostpixel-history");

    loadHistory();
}

function exportHistory(){
    const history = JSON.parse(localStorage.getItem("ghostpixel-history") || "[]");
    const blob = new Blob([JSON.stringify(history, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ghostpixel-history.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}

function runScan(){

    const url = document.getElementById("targetUrl").value.trim();

    if(!url){
        alert("Enter an image URL");
        return;
    }

    let parsed;

    try{
        parsed = new URL(url);
    }catch(e){
        alert("Invalid URL. Make sure it starts with http:// or https://");
        return;
    }

    const img = new Image();
    const preview = document.getElementById('preview');
    preview.style.display = 'none';
    preview.src = '';

    const start = performance.now();

    img.onload = ()=>{

        const ms = Math.round(performance.now() - start);

        const result = `\n        ✅ Loaded\n        Host: ${parsed.hostname}\n        Size: ${img.naturalWidth} × ${img.naturalHeight}\n        Time: ${ms}ms\n        `;

        document.getElementById("results").innerHTML = `<div class="result">${escapeHtml(result).replace(/\n/g,'<br>')}</div>`;

        // show preview
        preview.src = url;
        preview.style.display = 'block';

        saveHistory({
            time: new Date().toISOString(),
            host: parsed.hostname,
            status: `Loaded ${img.naturalWidth}x${img.naturalHeight} ${ms}ms`,
            url: url
        });

    };

    img.onerror = (ev)=>{

        document.getElementById("results").innerHTML = `<div class="result">❌ Failed to load image. This may be a network/CORS issue or the resource does not exist.</div>`;

        preview.style.display = 'none';

        saveHistory({
            time: new Date().toISOString(),
            host: parsed.hostname,
            status: 'Failed',
            url: url
        });

    };

    // set crossOrigin to anonymous to try to avoid tainting canvas if later added
    img.crossOrigin = 'anonymous';
    img.src = url;

}

function escapeHtml(unsafe) {
    return unsafe
         .replace(/&/g, "&amp;")
         .replace(/</g, "&lt;")
         .replace(/>/g, "&gt;")
         .replace(/\"/g, "&quot;")
         .replace(/'/g, "&#039;");
}

loadHistory();

</script>

</body>
</html>
